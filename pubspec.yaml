name: aduro
description: "Aduro Guard — offline medicine safety scanner for Ghana, powered by Gemma 4 on-device."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_gemma: ^1.3.1
  camera: ^0.12.0+2
  sqflite: ^2.4.2+1
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  flutter_tts: ^4.2.5
  record: ^6.2.1
  flutter_dotenv: ^6.0.1
  flutter_gemma_litertlm: ^1.1.0
  image_picker: ^1.2.3
  file_selector: ^1.1.0
  sherpa_onnx: ^1.13.4
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/db/

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-600.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-700.ttf
          weight: 700
    - family: Public Sans
      fonts:
        - asset: assets/fonts/PublicSans-400.ttf
          weight: 400
        - asset: assets/fonts/PublicSans-500.ttf
          weight: 500
        - asset: assets/fonts/PublicSans-600.ttf
          weight: 600
        - asset: assets/fonts/PublicSans-700.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-500.ttf
          weight: 500

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#8F6113"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  adaptive_icon_monochrome: "assets/icon/icon_mono.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#8F6113"
  image: assets/icon/icon_fg.png
  android_12:
    color: "#8F6113"
    image: assets/icon/icon_fg.png
